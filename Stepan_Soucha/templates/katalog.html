{% extends 'base.html' %}

{% block content %}
    <h1>Katalog karet</h1>
    
    <!-- Jednoduché zarovnání karet vedle sebe -->
    <div style="display: flex; gap: 20px; flex-wrap: wrap;">
        
        <!-- Tento cyklus projde všechny karty z databáze a pro každou vytvoří tento blok -->
        {% for karta in karty %}
            <div style="border: 1px solid #ccc; padding: 15px; width: 220px; text-align: center; border-radius: 8px;">
                <!-- Zobrazení obrázku z PokéAPI URL -->
                <img src="{{ karta['obrazek_url'] }}" alt="{{ karta['nazev'] }}" style="width: 150px; height: 150px; object-fit: contain;">
                
                <h2>{{ karta['nazev'] }}</h2>
                <p><em>{{ karta['popis'] }}</em></p>
                <h3 style="color: #d9534f;">{{ karta['cena'] }} Kč</h3>
                <p><small>Skladem: {{ karta['kusu_skladem'] }} ks</small></p>
                
                <button style="padding: 10px; background-color: #5cb85c; color: white; border: none; border-radius: 5px; cursor: pointer;">
                    Přidat do košíku
                </button>
            </div>
        {% endfor %}
        
    </div>
{% endblock %}
