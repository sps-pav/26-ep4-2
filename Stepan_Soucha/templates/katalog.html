{% extends 'base.html' %}

{% block content %}
    <h1>Katalog karet</h1>
    
    <div class="katalog-grid">
        {% for karta in karty %}
            <div class="karta">
                <img src="{{ karta['obrazek_url'] }}" alt="{{ karta['nazev'] }}">
                <h2>{{ karta['nazev'] }}</h2>
                <p><em>{{ karta['popis'] }}</em></p>
                <h3>{{ karta['cena'] }} Kč</h3>
                <p><small>Skladem: {{ karta['kusu_skladem'] }} ks</small></p>
                
                <form action="{{ url_for('pridat_do_kosiku', id_produktu=karta['id']) }}" method="POST" style="margin: 0;">
                    <button type="submit" class="btn-koupit">Přidat do košíku</button>
                </form>
            </div>
        {% endfor %}
    </div>
{% endblock %}
